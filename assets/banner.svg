<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#070a14" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Card Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Chart Fill Gradient -->
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 38px;
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 16px;
        fill: #94a3b8;
      }
      .badge-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 12px;
        fill: #e2e8f0;
      }
      .card-label {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 11px;
        fill: #64748b;
        text-transform: uppercase;
        letter-spacing: 0.8px;
      }
      .card-val {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 700;
        font-size: 16px;
        fill: #38bdf8;
      }

      /* Dynamic Animations */
      @keyframes floatGrid {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-5px); }
        100% { transform: translateY(0px); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 0.85; }
      }
      @keyframes growBar {
        0%, 100% { transform: scaleY(1); }
        50% { transform: scaleY(1.22); }
      }
      @keyframes waveLine {
        0% { stroke-dashoffset: 0; }
        50% { stroke-dashoffset: 20; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes orbitParticle {
        0% { transform: translateX(0px) translateY(0px); }
        33% { transform: translateX(15px) translateY(-10px); }
        66% { transform: translateX(-10px) translateY(12px); }
        100% { transform: translateX(0px) translateY(0px); }
      }

      .floating-layer {
        animation: floatGrid 7s ease-in-out infinite;
      }
      .glowing-orb {
        animation: pulseGlow 4s ease-in-out infinite;
      }
      .bar-dynamic-1 {
        transform-origin: bottom;
        animation: growBar 3.2s ease-in-out infinite;
      }
      .bar-dynamic-2 {
        transform-origin: bottom;
        animation: growBar 4.1s ease-in-out infinite 0.7s;
      }
      .bar-dynamic-3 {
        transform-origin: bottom;
        animation: growBar 3.6s ease-in-out infinite 1.3s;
      }
      .particle-1 {
        animation: orbitParticle 6s ease-in-out infinite;
      }
      .particle-2 {
        animation: orbitParticle 8s ease-in-out infinite 2s;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="340" fill="url(#bgGrad)" rx="16" />

  <!-- Animated Glowing Ambience in background -->
  <circle class="glowing-orb" cx="150" cy="80" r="130" fill="#38bdf8" opacity="0.12" filter="url(#glow)" />
  <circle class="glowing-orb" cx="1050" cy="180" r="160" fill="#818cf8" opacity="0.15" filter="url(#glow)" />
  <circle class="glowing-orb" cx="600" cy="300" r="180" fill="#c084fc" opacity="0.08" filter="url(#glow)" />

  <!-- Subtle Financial Grid lines in background -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="200" y1="0" x2="200" y2="340" />
    <line x1="400" y1="0" x2="400" y2="340" />
    <line x1="600" y1="0" x2="600" y2="340" />
    <line x1="800" y1="0" x2="800" y2="340" />
    <line x1="1000" y1="0" x2="1000" y2="340" />
  </g>

  <!-- Dynamic Financial Wave Chart (Background graphic) -->
  <g class="floating-layer" opacity="0.85">
    <!-- Chart Area Fill -->
    <path d="M 720 280 Q 800 230, 880 250 T 1040 160 T 1160 130 L 1160 290 L 720 290 Z" fill="url(#chartGrad)" />
    <!-- Dynamic Line -->
    <path d="M 720 280 Q 800 230, 880 250 T 1040 160 T 1160 130" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
    <!-- Pulse Dots -->
    <circle cx="880" cy="250" r="4" fill="#38bdf8" />
    <circle cx="1040" cy="160" r="5" fill="#818cf8" />
    <circle cx="1160" cy="130" r="5" fill="#38bdf8" />

    <!-- Animated Financial Bars in Background right corner -->
    <g transform="translate(930, 270)">
      <rect class="bar-dynamic-1" x="0" y="-75" width="14" height="75" rx="3" fill="#818cf8" opacity="0.75" />
      <rect class="bar-dynamic-2" x="22" y="-105" width="14" height="105" rx="3" fill="#38bdf8" opacity="0.85" />
      <rect class="bar-dynamic-3" x="44" y="-60" width="14" height="60" rx="3" fill="#c084fc" opacity="0.7" />
      <rect class="bar-dynamic-1" x="66" y="-120" width="14" height="120" rx="3" fill="#38bdf8" opacity="0.9" />
    </g>
  </g>

  <!-- Floating Dynamic Particle Orbs -->
  <circle class="particle-1" cx="690" cy="90" r="3" fill="#38bdf8" opacity="0.7" />
  <circle class="particle-2" cx="740" cy="140" r="4" fill="#818cf8" opacity="0.6" />
  <circle class="particle-1" cx="1120" cy="80" r="3.5" fill="#c084fc" opacity="0.8" />

  <!-- Floating Pill Cards (Right Side Decorative) -->
  <g class="floating-layer">
    <!-- Card 1: Multi-Entity Close -->
    <g transform="translate(860, 42)">
      <rect width="185" height="42" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
      <circle cx="22" cy="21" r="7" fill="#10b981" />
      <text x="38" y="19" class="card-label">Financial Close</text>
      <text x="38" y="32" class="card-val" font-size="12px" fill="#cbd5e1">GAAP / IFRS Automated</text>
    </g>
    <!-- Card 2: Consolidation -->
    <g transform="translate(980, 96)">
      <rect width="175" height="42" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
      <circle cx="22" cy="21" r="7" fill="#38bdf8" />
      <text x="38" y="19" class="card-label">Consolidation</text>
      <text x="38" y="32" class="card-val" font-size="12px" fill="#cbd5e1">IC Eliminations &amp; NCI</text>
    </g>
  </g>

  <!-- FOREGROUND CONTENT: Header, Title & Subtitles (Always Crisp and in Front) -->
  <g transform="translate(60, 65)">
    <!-- Top Category Pill -->
    <g>
      <rect width="260" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1" />
      <circle cx="16" cy="14" r="5" fill="#38bdf8" />
      <text x="30" y="18" class="badge-text" fill="#38bdf8">ENTERPRISE PERFORMANCE MANAGEMENT</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="80" class="title-text" fill="url(#primaryGrad)">Awesome EPM &amp; CPM</text>

    <!-- Subtitle Description -->
    <text x="0" y="116" class="subtitle-text">Curated SaaS Platforms, Financial Consolidation &amp; Open-Source Tools</text>

    <!-- Metric / Pillar Feature Pills -->
    <g transform="translate(0, 142)">
      <!-- Pill 1 -->
      <g>
        <rect width="165" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="14" y="22" class="badge-text">📊 Planning &amp; Budgeting</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(175, 0)">
        <rect width="180" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="14" y="22" class="badge-text">🌐 Financial Consolidation</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(365, 0)">
        <rect width="170" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="14" y="22" class="badge-text">⚡ OLAP &amp; Variance Engine</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(545, 0)">
        <rect width="145" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="14" y="22" class="badge-text">🤖 AI-Native FP&amp;A</text>
      </g>
    </g>
  </g>

  <!-- Border Outline around Banner -->
  <rect x="0.5" y="0.5" width="1199" height="339" rx="16" fill="none" stroke="#334155" stroke-width="1" stroke-opacity="0.6" />
</svg>
